# Railway config-as-code — serviço backend.
# Requisito no dashboard: Service > Settings > Root Directory = "backend"
# (o Dockerfile faz COPY a partir do contexto backend/).
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# CMD do Dockerfile já é este; explícito aqui para clareza.
startCommand = "node dist/main.js"
# Endpoint público (@Public) — global prefix "api" + @Controller('health').
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Migrations não rodam no startup do processo web. O histórico do projeto foi
# aplicado por `prisma db push` e precisa de baseline/reparo antes que
# `prisma migrate deploy` possa ser reativado com segurança.
# PORT é injetado pelo Railway automaticamente (main.ts lê process.env.PORT).
