server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: o roteamento é do React Router, então qualquer path que não seja um
    # arquivo real cai no index.html. Sem isso, abrir /catalog/cars direto (ou
    # dar F5 numa rota interna) devolve 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets do Vite têm hash no nome, então podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca pode ser cacheado: é ele que aponta para o bundle novo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
